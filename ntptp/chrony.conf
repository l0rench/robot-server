# NTP 服务器配置
# 系统时间通过 phc2sys 同步到 PTP
# chrony 把系统时间（PTP 时间）分发给 192.168.7.0/24 网段
# PTP 硬件时钟作为主时间源
# 本地时钟作为时间源
refclock PHC /dev/ptp0 poll 2 dpoll 4 offset 0
local stratum 8 orphan

# 允许接收端（192.168.7.2）同步时间
allow 192.168.7.0/24

# 时间调整参数
maxupdateskew 100.0
makestep 1 3

# 配置文件目录
confdir /etc/chrony/conf.d
sourcedir /run/chrony-dhcp
sourcedir /etc/chrony/sources.d

# 密钥和漂移文件
keyfile /etc/chrony/chrony.keys
driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
logdir /var/log/chrony

# 使用RTC作为后备
rtcsync

# 时区
leapsectz right/UTC
